# Nipun.AI — Production Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# In production ALL services run in containers (including backend + frontend).

services:

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    restart: always
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?required in prod}
      --save 60 1000
      --appendonly yes

  qdrant:
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?required in prod}
    deploy:
      resources:
        limits:
          memory: 2g

  # Neo4j is off by default (GRAPH_ENABLED=false); when enabled in prod its password MUST be set
  # explicitly (no publicly-known default) and its memory is bounded.
  neo4j:
    restart: always
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?required in prod}"
    deploy:
      resources:
        limits:
          memory: 2g

  elasticsearch:
    restart: always
    environment:
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?required in prod}
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    deploy:
      resources:
        limits:
          memory: 3g

  # One-shot DB migration. Runs to completion BEFORE the backend starts serving, so the
  # schema is guaranteed present. `service_completed_successfully` gates the backend on it.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nipun-migrate
    restart: "no"
    env_file: .env
    command: python -m src.db.migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nipun-net

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nipun-backend
    restart: always
    env_file: .env
    # NOT published to the host — only reachable inside nipun-net (via nginx). `expose` keeps
    # the port open to linked containers without a host port mapping.
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      # The backend image is python:slim (no curl). Use the interpreter that IS present.
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code<500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      # Scale out by raising BACKEND_REPLICAS. NOTE: running >1 replica requires REMOVING the
      # `container_name` above (a fixed name cannot apply to multiple containers); nginx then load-
      # balances across replicas via the `backend` service DNS alias. UVICORN_WORKERS controls the
      # in-process worker count PER replica (default 2).
      replicas: ${BACKEND_REPLICAS:-1}
      resources:
        limits:
          memory: 2g
    networks:
      - nipun-net

  # Celery worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nipun-worker
    restart: always
    env_file: .env
    command: celery -A src.worker.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - backend
    healthcheck:
      # `celery inspect ping` (no destination) returns 0 iff at least one worker in this app
      # answers on the broker — a true liveness signal without needing the container hostname.
      test: ["CMD", "celery", "-A", "src.worker.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1500m
    networks:
      - nipun-net

  # Celery beat scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nipun-beat
    restart: always
    env_file: .env
    command: celery -A src.worker.celery_app beat --loglevel=info
    depends_on:
      - backend
    healthcheck:
      # Beat has no ping endpoint; assert the process is alive via its schedule/pid file presence.
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nipun-net

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nipun-frontend
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - nipun-net

  # Nginx reverse proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: nipun-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nipun-net

  prometheus:
    profiles: []   # always on in prod (override dev profile)
    restart: always

  grafana:
    profiles: []
    restart: always
